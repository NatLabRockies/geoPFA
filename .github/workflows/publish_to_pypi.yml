name: Upload to PyPi

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

jobs:
  build_and_publish:
    name: Build and upload wheels
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        fetch-depth: 0
        fetch-tags: true

    - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
      with:
        pixi-version: 'latest'
        locked: true
        cache: true
        cache-write: ${{ github.ref == 'refs/heads/main' }}
        environments: build

    - name: Build
      run: pixi run -e build build-wheels

    - name: Publish to PyPi
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
      run: pixi run -e build publish-pypi
