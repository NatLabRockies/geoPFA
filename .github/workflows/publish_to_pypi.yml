name: Upload to PyPi

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

jobs:
  build_and_publish:
    name: Build and upload wheels
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
        fetch-tags: true

    - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
      with:
        pixi-version: 'latest'
        locked: true
        cache: true
        cache-write: ${{ github.ref == 'refs/heads/main' }}
        environments: build

    - name: Build
      run: pixi run -e build build-wheels

    - name: Publish to PyPi
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
      run: pixi run -e build publish-pypi
